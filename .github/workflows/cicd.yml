name: LilyAI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Black
        run: |
          cd backend && black --check app/

      - name: Run isort
        run: |
          cd backend && isort --check-only app/

      - name: Run Bandit
        run: |
          cd backend && bandit -r app/ -ll --exclude app/tests

      - name: Check for sensitive data in logs
        run: |
          cd backend && grep -rn "logger.*question\|logger.*answer\|logger.*email\|log.*password" app/ --include="*.py" && echo "FAIL: Sensitive data may be logged" && exit 1 || echo "No sensitive data logging detected"

      - name: Check for print statements
        run: |
          cd backend && grep -r "print(" app/ --include="*.py" | grep -v "#" | grep -v "test" && echo "WARNING: print statements found - use logger instead" && exit 1 || echo "No print statements found"